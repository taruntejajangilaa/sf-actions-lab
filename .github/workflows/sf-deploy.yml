name: Salesforce Deploy to Master

on:
  workflow_dispatch:   # manual trigger for controlled deploy
  # optional later: push to master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Write JWT key file
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate to Salesforce (JWT)
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias ci-org

      - name: Deploy with specified tests
        run: |
          sf project deploy start \
            --target-org ci-org \
            --source-dir force-app \
            --test-level RunSpecifiedTests \
            --tests HelloActionsTest \
            --wait 60

      - name: Cleanup key file
        if: always()
        run: rm -f server.key