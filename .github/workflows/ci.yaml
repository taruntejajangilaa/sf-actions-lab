name: Salesforce Lab CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Check Salesforce project file
        run: |
          if [ ! -f sfdx-project.json ]; then
            echo "sfdx-project.json missing"
            exit 1
          fi
          echo "Salesforce DX project detected"